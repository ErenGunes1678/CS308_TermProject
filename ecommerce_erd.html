
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  USER {
    int id PK
    string name
    string tax_id
    string email
    string password_hash
    string home_address
    string role
    timestamp created_at
  }
  CATEGORY {
    int id PK
    string name
    string description
    int parent_id FK
  }
  PRODUCT {
    int id PK
    string name
    string model
    string serial_number
    text description
    int quantity_in_stock
    decimal price
    decimal discounted_price
    boolean warranty_status
    string distributor_info
    int category_id FK
    decimal avg_rating
    timestamp created_at
  }
  CART {
    int id PK
    int user_id FK
    string session_id
    timestamp created_at
  }
  CART_ITEM {
    int id PK
    int cart_id FK
    int product_id FK
    int quantity
    decimal unit_price
  }
  ORDER {
    int id PK
    int user_id FK
    decimal total_amount
    string status
    string delivery_address
    string payment_status
    int card_last_four
    timestamp ordered_at
    timestamp updated_at
  }
  ORDER_ITEM {
    int id PK
    int order_id FK
    int product_id FK
    int quantity
    decimal unit_price
    decimal discount_applied
    boolean is_returned
    timestamp purchased_at
  }
  INVOICE {
    int id PK
    int order_id FK
    int user_id FK
    decimal total_amount
    string pdf_path
    boolean emailed
    timestamp issued_at
  }
  DELIVERY_LIST {
    int id PK
    int order_id FK
    int customer_id FK
    int product_id FK
    int quantity
    decimal total_price
    string delivery_address
    string status
    boolean is_completed
    timestamp dispatched_at
  }
  COMMENT {
    int id PK
    int user_id FK
    int product_id FK
    int rating
    text content
    string status
    timestamp created_at
    timestamp approved_at
  }
  WISHLIST {
    int id PK
    int user_id FK
    int product_id FK
    timestamp added_at
  }
  REFUND_REQUEST {
    int id PK
    int order_item_id FK
    int user_id FK
    string reason
    string status
    decimal refund_amount
    timestamp requested_at
    timestamp resolved_at
  }
  DISCOUNT {
    int id PK
    int product_id FK
    int created_by FK
    decimal discount_rate
    decimal original_price
    decimal new_price
    timestamp starts_at
    timestamp ends_at
  }

  USER ||--o{ CART : has
  USER ||--o{ ORDER : places
  USER ||--o{ COMMENT : writes
  USER ||--o{ WISHLIST : maintains
  USER ||--o{ REFUND_REQUEST : submits
  USER ||--o{ INVOICE : receives
  CATEGORY ||--o{ PRODUCT : contains
  PRODUCT ||--o{ CART_ITEM : included_in
  PRODUCT ||--o{ ORDER_ITEM : part_of
  PRODUCT ||--o{ COMMENT : receives
  PRODUCT ||--o{ WISHLIST : saved_in
  PRODUCT ||--o{ DELIVERY_LIST : delivered_via
  PRODUCT ||--o{ DISCOUNT : has
  CART ||--o{ CART_ITEM : contains
  ORDER ||--o{ ORDER_ITEM : contains
  ORDER ||--|| INVOICE : generates
  ORDER ||--o{ DELIVERY_LIST : fulfilled_by
  ORDER_ITEM ||--o{ REFUND_REQUEST : triggers
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
