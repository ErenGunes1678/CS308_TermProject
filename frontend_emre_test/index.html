<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend_new | Main Page</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <section class="hero">
          <h1>Main Page</h1>
          <p>
            This frontend talks directly to your backend APIs. Use it to test
            product listing and add-to-cart behavior without touching the old
            frontend.
          </p>
        </section>

        <section class="nav-card">
          <nav class="nav-links">
            <a class="nav-link" data-nav-link="home" href="/">Main Page</a>
            <a class="nav-link" data-nav-link="login" href="/login.html">Login</a>
            <a class="nav-link" data-nav-link="cart" href="/cart.html">
              Cart <span class="badge" data-cart-count>0</span>
            </a>
          </nav>

          <div class="nav-actions">
            <input data-api-base-input type="text" value="http://localhost:3000" />
            <button class="small-button" type="button" data-save-api-base>Save API Base</button>
            <button class="danger-button hidden" type="button" data-logout>Logout</button>
          </div>

          <div class="status-row">
            <strong>Session:</strong>
            <span data-user-status>Checking session...</span>
          </div>
        </section>
      </header>

      <section class="message-panel hidden" data-page-message></section>
      <section class="card-grid" data-product-grid></section>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
